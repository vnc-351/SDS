{% extends 'base.html' %}

{% block title %}CampusFix | Register{% endblock %}

{% block content %}
<div class="auth-wrapper" style="max-width: 480px;">
  <div class="auth-card">
    <div class="auth-header">
      <span class="brand-stamp mb-2 mx-auto" style="width: 32px; height: 32px; font-size: 0.85rem;" aria-hidden="true">CF</span>
      <h1 class="h3 fw-bold mb-1">Student Registration</h1>
      <p class="text-secondary small mb-0">Create an account to report and vote on COEP campus issues</p>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" id="name" placeholder="First and last name" autocomplete="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="student@example.com" autocomplete="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Create a secure password" autocomplete="new-password" required>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" id="confirm_password" placeholder="Re-enter password" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2">Create Account</button>
    </form>

    <div class="mt-4 pt-3 border-top text-center text-secondary small">
      Already registered? <a href="{{ url_for('auth.login') }}" class="fw-semibold">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
